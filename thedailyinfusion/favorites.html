<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Favorite Drinks — StillSip</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/icon.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Shared Theme & Styles -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="constants.js"></script>
  <script src="common.js"></script>
</head>
<body class="min-h-screen flex flex-col">

  <!-- DYNAMIC NAVIGATION HEADER -->
  <header id="site-header"></header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
    
    <!-- PAGE HERO HEADER -->
    <div class="text-left mb-8 border-b border-cozy-border pb-6 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-serif-heading text-3xl md:text-4xl font-bold text-cozy-text mb-2">Favorite Drinks ❤️</h1>
        <p class="text-cozy-muted text-base">Your saved collection of non-alcoholic infusions, lassis, and teas.</p>
      </div>
      
      <div class="flex items-center gap-2">
        <button 
          id="clear-favs-btn" 
          onclick="clearAllFavorites()" 
          class="text-xs font-semibold text-cozy-muted bg-white border border-cozy-border px-3.5 py-2 rounded-full hover:border-red-400 hover:text-red-600 transition"
        >
          Clear Favorites
        </button>
      </div>
    </div>

    <!-- FAVORITES GRID -->
    <div id="favorites-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamically rendered -->
    </div>

    <!-- EMPTY STATE -->
    <div id="favorites-empty-state" class="hidden text-center py-16 cozy-card rounded-cozy p-8 max-w-md mx-auto my-8">
      <span class="text-5xl block mb-4">🤍</span>
      <h3 class="font-serif-heading font-bold text-xl text-cozy-text mb-2">No favorite recipes yet</h3>
      <p class="text-cozy-muted text-sm leading-relaxed mb-6">
        Tap the heart icon on any recipe card to save your go-to beverages here for quick access.
      </p>
      <a 
        href="recipes.html" 
        class="inline-block px-6 py-3 rounded-full bg-cozy-olivegreen text-white font-semibold text-xs hover:bg-cozy-olivegreen-hover transition shadow-md"
      >
        Explore All Recipes →
      </a>
    </div>

  </main>

  <!-- DYNAMIC FOOTER -->
  <footer id="site-footer"></footer>

  <!-- RECIPE DATABASE & LOGIC -->
  <script src="recipes.js"></script>
  <script>
    let favorites = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadFavorites();
    });

    function loadFavorites() {
      favorites = State.getFavorites();
      renderFavorites();
    }

    function renderFavorites() {
      const grid = document.getElementById('favorites-grid');
      const emptyState = document.getElementById('favorites-empty-state');
      const clearBtn = document.getElementById('clear-favs-btn');

      // Fetch combined list (built-in + user-created custom drinks)
      const allRecipes = typeof getCombinedRecipes === 'function' ? getCombinedRecipes() : ALL_RECIPES;
      
      // Filter recipes that exist in the user's favorites array
      const favoritedRecipes = allRecipes.filter(r => favorites.includes(r.id));

      if (favoritedRecipes.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        clearBtn.classList.add('opacity-50', 'pointer-events-none');
        return;
      }

      emptyState.classList.add('hidden');
      clearBtn.classList.remove('opacity-50', 'pointer-events-none');

      grid.innerHTML = favoritedRecipes.map(r => `
        <div class="cozy-card rounded-cozy p-5 flex flex-col justify-between hover:-translate-y-1 transition-all duration-200">
          <div>
            <!-- Header Badges -->
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-2.5 py-0.5 rounded-full">
                ${r.style}
              </span>
              
              <div class="flex items-center gap-2">
                <span class="text-xs text-cozy-muted font-medium">⚡ ${r.prepMinutes || r.prepTime}</span>
                <button 
                  onclick="removeFavorite('${r.id}')" 
                  class="text-sm hover:scale-110 transition p-1" 
                  title="Remove from favorites"
                >
                  ❤️
                </button>
              </div>
            </div>

            <!-- Recipe Name -->
            <a href="recipe.html?id=${r.id}">
              <h3 class="font-serif-heading font-bold text-lg text-cozy-text hover:text-cozy-olivegreen transition mb-2">
                ${r.name}
              </h3>
            </a>

            <!-- Description -->
            <p class="text-xs text-cozy-muted line-clamp-2 leading-relaxed mb-4">
              ${r.description}
            </p>

            <!-- Ingredients Preview -->
            <div class="pt-3 border-t border-cozy-border mb-4">
              <span class="text-[10px] font-bold uppercase tracking-wider text-cozy-muted block mb-1">Main Ingredients:</span>
              <p class="text-xs text-cozy-text font-medium line-clamp-1">
                ${r.ingredients.map(i => i.name).join(', ')}
              </p>
            </div>
          </div>

          <!-- Action Link -->
          <a 
            href="recipe.html?id=${r.id}" 
            class="w-full py-2.5 rounded-xl border border-cozy-olivegreen bg-cozy-olivegreen text-center text-xs font-semibold text-white hover:bg-cozy-olivegreen-hover transition flex items-center justify-center gap-1 shadow-sm"
          >
            <span>View Recipe</span>
            <span>→</span>
          </a>
        </div>
      `).join('');
    }

    // Remove single item from favorites
    function removeFavorite(id) {
      favorites = favorites.filter(favId => favId !== id);
      State.saveFavorites(favorites);
      renderFavorites();
    }

    // Clear all favorites
    function clearAllFavorites() {
      if (favorites.length === 0) return;

      if (confirm("Are you sure you want to clear all your saved favorites?")) {
        favorites = [];
        State.saveFavorites(favorites);
        renderFavorites();
      }
    }
  </script>
</body>
</html>
