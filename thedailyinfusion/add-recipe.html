<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add New Recipe — StillSip</title>
  
  <link rel="icon" type="image/png" href="images/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="constants.js"></script>
  <script src="common.js"></script>
</head>
<body class="min-h-screen flex flex-col">

  <header id="site-header"></header>

  <datalist id="pantry-ingredients-list"></datalist>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    
    <div class="mb-6">
      <a href="recipes.html" class="inline-flex items-center gap-2 text-sm font-medium text-cozy-muted hover:text-cozy-olivegreen transition">
        ← Back to all recipes
      </a>
    </div>

    <div class="cozy-card rounded-cozy p-6 md:p-8">
      
      <div class="border-b border-cozy-border pb-6 mb-6">
        <h1 class="font-serif-heading text-3xl font-bold text-cozy-text mb-2">Create New Drink Recipe</h1>
        <p class="text-cozy-muted text-sm">Add a custom non-alcoholic, still beverage to your personal library.</p>
      </div>

      <form id="add-recipe-form" onsubmit="handleSaveRecipe(event)" class="space-y-8">
        
        <!-- 1. BASIC INFO -->
        <div class="space-y-4">
          <h2 class="font-serif-heading font-bold text-lg text-cozy-text">1. Basic Details</h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Drink Name *</label>
              <input 
                type="text" 
                id="recipe-name" 
                required 
                placeholder="e.g. Mango Matcha Layered Latte" 
                class="w-full px-3.5 py-2.5 bg-cozy-bg rounded-xl border border-cozy-border text-cozy-text text-sm focus:outline-none focus:border-cozy-olivegreen" 
              />
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Drink Style *</label>
              <select id="recipe-style" required class="w-full px-3.5 py-2.5 bg-cozy-bg rounded-xl border border-cozy-border text-cozy-text text-sm focus:outline-none focus:border-cozy-olivegreen">
                <!-- Dynamically populated from TAXONOMY.STYLES -->
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Short Description *</label>
            <textarea id="recipe-description" required rows="2" placeholder="Briefly describe the flavor and feel of this drink..." class="w-full px-3.5 py-2.5 bg-cozy-bg rounded-xl border border-cozy-border text-cozy-text text-sm focus:outline-none focus:border-cozy-olivegreen"></textarea>
          </div>
        </div>

        <hr class="border-cozy-border" />

        <!-- 2. MULTI-COLOR & ATTRIBUTES -->
        <div class="space-y-5">
          <h2 class="font-serif-heading font-bold text-lg text-cozy-text">2. Attributes & Tags</h2>
          
          <!-- MULTI-SELECT DRINK COLORS -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-2">
              Drink Color(s) <span class="text-cozy-muted font-normal">(Select 1 or more for multi-colored/layered drinks)</span>
            </label>
            <div id="recipe-color-checkboxes" class="flex flex-wrap gap-2">
              <!-- Dynamically populated multi-select checkboxes -->
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 pt-2">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Temperature</label>
              <select id="recipe-temp" class="w-full px-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-xs font-medium">
                <!-- TAXONOMY.TEMPERATURES -->
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Primary Taste</label>
              <select id="recipe-taste" class="w-full px-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-xs font-medium">
                <!-- TAXONOMY.TASTES -->
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Season</label>
              <select id="recipe-season" class="w-full px-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-xs font-medium">
                <!-- TAXONOMY.SEASONS -->
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Prep Time Tier</label>
              <select id="recipe-preptime" class="w-full px-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-xs font-medium">
                <!-- TAXONOMY.PREP_TIMES -->
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Prep Duration Label</label>
            <input type="text" id="recipe-minutes" placeholder="e.g. 5 mins" class="w-full max-w-xs px-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-xs font-medium" />
          </div>
        </div>

        <hr class="border-cozy-border" />

        <!-- 3. INGREDIENTS WITH SEARCH AUTOCOMPLETE -->
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="font-serif-heading font-bold text-lg text-cozy-text">3. Ingredients</h2>
              <p class="text-xs text-cozy-muted">Search existing pantry items or type custom ingredients</p>
            </div>
            <button type="button" onclick="addIngredientRow()" class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-3 py-1.5 rounded-full hover:bg-cozy-olivegreen hover:text-white transition">
              + Add Ingredient
            </button>
          </div>

          <div id="ingredients-inputs-container" class="space-y-3">
            <!-- Dynamic ingredient rows -->
          </div>
        </div>

        <hr class="border-cozy-border" />

        <!-- 4. INSTRUCTIONS STEPS -->
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="font-serif-heading font-bold text-lg text-cozy-text">4. Preparation Steps</h2>
            <button type="button" onclick="addInstructionRow()" class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-3 py-1.5 rounded-full hover:bg-cozy-olivegreen hover:text-white transition">
              + Add Step
            </button>
          </div>

          <div id="instructions-inputs-container" class="space-y-3">
            <!-- Dynamic step rows -->
          </div>
        </div>

        <hr class="border-cozy-border" />

        <!-- SUBMIT ACTIONS -->
        <div class="pt-4 flex items-center justify-end gap-3">
          <a href="recipes.html" class="px-6 py-3 rounded-full border border-cozy-border text-cozy-muted text-sm font-semibold hover:text-cozy-text transition">
            Cancel
          </a>
          <button type="submit" class="px-8 py-3 rounded-full bg-cozy-olivegreen text-white font-semibold text-sm hover:bg-cozy-olivegreen-hover transition shadow-md">
            Save Recipe ✨
          </button>
        </div>

      </form>

    </div>

  </main>

  <footer id="site-footer"></footer>

  <script src="recipes.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      populateFormDropdowns();
      
      addIngredientRow();
      addIngredientRow();
      addInstructionRow();
      addInstructionRow();
    });

    function populateFormDropdowns() {
      // Datalist for ingredient search
      const datalist = document.getElementById('pantry-ingredients-list');
      datalist.innerHTML = TAXONOMY.getAllIngredients().map(ing => `<option value="${ing}">`).join('');

      // Render Multi-Select Color Checkboxes
      const colorContainer = document.getElementById('recipe-color-checkboxes');
      colorContainer.innerHTML = TAXONOMY.COLORS.map(c => `
        <label class="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-cozy-border bg-cozy-bg text-xs font-medium text-cozy-text hover:border-cozy-olivegreen transition select-none">
          <input type="checkbox" name="recipe-color-option" value="${c.value}" class="color-checkbox accent-[#8F9B5F] rounded" />
          <span>${c.label}</span>
        </label>
      `).join('');

      // Dropdowns
      document.getElementById('recipe-style').innerHTML = TAXONOMY.STYLES.map(s => `<option value="${s.value}">${s.label}</option>`).join('');
      document.getElementById('recipe-temp').innerHTML = TAXONOMY.TEMPERATURES.map(t => `<option value="${t.value}">${t.label}</option>`).join('');
      document.getElementById('recipe-taste').innerHTML = TAXONOMY.TASTES.map(t => `<option value="${t.value}">${t.label}</option>`).join('');
      document.getElementById('recipe-season').innerHTML = TAXONOMY.SEASONS.map(s => `<option value="${s.value}">${s.label}</option>`).join('');
      document.getElementById('recipe-preptime').innerHTML = TAXONOMY.PREP_TIMES.map(p => `<option value="${p.value}">${p.label}</option>`).join('');
    }

    function addIngredientRow() {
      const container = document.getElementById('ingredients-inputs-container');
      const row = document.createElement('div');
      row.className = 'flex items-center gap-2 ingredient-row';
      row.innerHTML = `
        <input 
          type="text" 
          list="pantry-ingredients-list" 
          placeholder="Search ingredient (e.g. Lime Juice)" 
          class="ing-name flex-1 px-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-xs focus:outline-none focus:border-cozy-olivegreen" 
          required 
        />
        <input type="number" step="0.1" placeholder="Amount" class="ing-amount w-20 px-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-xs focus:outline-none focus:border-cozy-olivegreen" required />
        <input type="text" placeholder="Unit (cup/tbsp)" class="ing-unit w-28 px-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-xs focus:outline-none focus:border-cozy-olivegreen" required />
        <button type="button" onclick="this.parentElement.remove()" class="p-2 text-cozy-muted hover:text-red-600 text-xs font-bold">✕</button>
      `;
      container.appendChild(row);
    }

    function addInstructionRow() {
      const container = document.getElementById('instructions-inputs-container');
      const stepNumber = container.children.length + 1;
      const row = document.createElement('div');
      row.className = 'flex items-center gap-2 instruction-row';
      row.innerHTML = `
        <span class="text-xs font-bold text-cozy-olivegreen w-12">Step ${stepNumber}:</span>
        <input type="text" placeholder="Describe this step..." class="step-desc flex-1 px-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-xs focus:outline-none focus:border-cozy-olivegreen" required />
        <button type="button" onclick="this.parentElement.remove()" class="p-2 text-cozy-muted hover:text-red-600 text-xs font-bold">✕</button>
      `;
      container.appendChild(row);
    }

    function handleSaveRecipe(e) {
      e.preventDefault();

      const name = document.getElementById('recipe-name').value.trim();
      const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + Date.now().toString().slice(-4);

      // Collect Multi-Selected Colors into an Array
      const checkedColorEls = document.querySelectorAll('.color-checkbox:checked');
      const selectedColors = Array.from(checkedColorEls).map(cb => cb.value);
      const color = selectedColors.length > 0 ? selectedColors : ["Clear"];

      // Collect Ingredients
      const ingRows = document.querySelectorAll('.ingredient-row');
      const ingredients = Array.from(ingRows).map(row => ({
        name: row.querySelector('.ing-name').value.trim(),
        amount: parseFloat(row.querySelector('.ing-amount').value) || 1,
        unit: row.querySelector('.ing-unit').value.trim()
      }));

      // Collect Steps
      const stepRows = document.querySelectorAll('.instruction-row');
      const instructions = Array.from(stepRows).map(row => row.querySelector('.step-desc').value.trim());

      const newRecipe = {
        id,
        name,
        style: document.getElementById('recipe-style').value,
        description: document.getElementById('recipe-description').value.trim(),
        temperature: document.getElementById('recipe-temp').value,
        color, // Saved as array e.g. ["Green", "Yellow"]
        primaryTaste: document.getElementById('recipe-taste').value,
        season: document.getElementById('recipe-season').value,
        prepTime: document.getElementById('recipe-preptime').value,
        prepMinutes: document.getElementById('recipe-minutes').value.trim() || '5 mins',
        healthiness: ["Caffeine-Free", "Homemade"],
        nutrients: ["Fresh Botanicals"],
        useCases: ["Custom Drink"],
        equipment: ["Standard Utensils"],
        tip: "Enjoy your custom homemade creation!",
        ingredients,
        instructions
      };

      const customRecipes = JSON.parse(localStorage.getItem('cozy_custom_recipes') || '[]');
      customRecipes.push(newRecipe);
      localStorage.setItem('cozy_custom_recipes', JSON.stringify(customRecipes));

      window.location.href = `recipe.html?id=${id}`;
    }
    let editModeId = null;

    document.addEventListener('DOMContentLoaded', () => {
      checkForEditMode();
    });

    function checkForEditMode() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawEditId = urlParams.get('edit');

      if (!rawEditId) return; // Normal "Add Recipe" mode

      editModeId = decodeURIComponent(rawEditId).trim();

      // Fetch recipe from recipes.js + localStorage
      const allRecipes = (typeof getCombinedRecipes === 'function') 
        ? getCombinedRecipes() 
        : (typeof ALL_RECIPES !== 'undefined' ? ALL_RECIPES : []);

      const recipeToEdit = allRecipes.find(r => {
        const rId = (r.id || '').toLowerCase();
        const rName = (r.name || '').toLowerCase();
        const target = editModeId.toLowerCase();
        return rId === target || rName === target;
      });

      if (!recipeToEdit) return;

      // 1. Update Page Headings & Button Text
      const pageHeading = document.querySelector('h1');
      if (pageHeading) pageHeading.innerText = `Edit "${recipeToEdit.name}"`;
      
      const submitBtn = document.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.innerText = '💾 Save Changes';

      // 2. Pre-fill basic form fields
      if (document.getElementById('recipe-name')) document.getElementById('recipe-name').value = recipeToEdit.name || '';
      if (document.getElementById('recipe-style')) document.getElementById('recipe-style').value = recipeToEdit.style || '';
      if (document.getElementById('recipe-description')) document.getElementById('recipe-description').value = recipeToEdit.description || '';
      if (document.getElementById('recipe-prep-time')) document.getElementById('recipe-prep-time').value = recipeToEdit.prepMinutes || recipeToEdit.prepTime || '';
      if (document.getElementById('recipe-taste')) document.getElementById('recipe-taste').value = recipeToEdit.primaryTaste || '';
      if (document.getElementById('recipe-tip')) document.getElementById('recipe-tip').value = recipeToEdit.tip || '';

      // 3. Pre-fill ingredients & instructions if dynamic input rows are used
      if (typeof populateIngredientsForm === 'function') {
        populateIngredientsForm(recipeToEdit.ingredients);
      }
      if (typeof populateInstructionsForm === 'function') {
        populateInstructionsForm(recipeToEdit.instructions);
      }
    }

    // Function to save updated recipe into localStorage
    function saveRecipe(updatedRecipe) {
      let customRecipes = JSON.parse(localStorage.getItem('cozy_custom_recipes') || '[]');

      if (editModeId) {
        // Overwrite existing custom recipe
        const index = customRecipes.findIndex(r => 
          (r.id && r.id.toLowerCase() === editModeId.toLowerCase()) ||
          (r.name && r.name.toLowerCase() === editModeId.toLowerCase())
        );

        if (index !== -1) {
          customRecipes[index] = updatedRecipe;
        } else {
          // If it was a built-in static recipe being edited, save the override as a custom recipe
          customRecipes.push(updatedRecipe);
        }
      } else {
        // New recipe
        customRecipes.push(updatedRecipe);
      }

      localStorage.setItem('cozy_custom_recipes', JSON.stringify(customRecipes));
      
      // Redirect back to recipe view
      const targetId = updatedRecipe.id || updatedRecipe.name;
      window.location.href = `recipe.html?id=${encodeURIComponent(targetId)}`;
    }
  </script>
</body>
</html>
