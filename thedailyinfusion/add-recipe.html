<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add New Recipe — StillSip</title>
  
  <link rel="icon" type="image/png" href="images/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="constants.js"></script>
  <script src="common.js"></script>
</head>
<body class="min-h-screen flex flex-col">

  <header id="site-header"></header>

  <datalist id="pantry-ingredients-list"></datalist>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    
    <div class="mb-6">
      <a href="recipes.html" class="inline-flex items-center gap-2 text-sm font-medium text-cozy-muted hover:text-cozy-olivegreen transition">
        ← Back to all recipes
      </a>
    </div>

    <div class="cozy-card rounded-cozy p-6 md:p-8">
      
      <div class="border-b border-cozy-border pb-6 mb-6">
        <h1 class="font-serif-heading text-3xl font-bold text-cozy-text mb-2">Create New Drink Recipe</h1>
        <p class="text-cozy-muted text-sm">Add a custom non-alcoholic, still beverage to your personal library.</p>
      </div>

      <form id="add-recipe-form" onsubmit="handleSaveRecipe(event)" class="space-y-8">
        
        <!-- 1. BASIC INFO -->
        <div class="space-y-4">
          <h2 class="font-serif-heading font-bold text-lg text-cozy-text">1. Basic Details</h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Drink Name *</label>
              <input 
                type="text" 
                id="recipe-name" 
                required 
                placeholder="e.g. Mango Matcha Layered Latte" 
                class="w-full px-3.5 py-2.5 bg-cozy-bg rounded-xl border border-cozy-border text-cozy-text text-sm focus:outline-none focus:border-cozy-olivegreen" 
              />
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Drink Style *</label>
              <select id="recipe-style" required class="w-full px-3.5 py-2.5 bg-cozy-bg rounded-xl border border-cozy-border text-cozy-text text-sm focus:outline-none focus:border-cozy-olivegreen">
                <!-- Dynamically populated from TAXONOMY.STYLES -->
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Short Description *</label>
            <textarea id="recipe-description" required rows="2" placeholder="Briefly describe the flavor and feel of this drink..." class="w-full px-3.5 py-2.5 bg-cozy-bg rounded-xl border border-cozy-border text-cozy-text text-sm focus:outline-none focus:border-cozy-olivegreen"></textarea>
          </div>
        </div>

        <hr class="border-cozy-border" />

        <!-- 2. MULTI-COLOR & ATTRIBUTES -->
        <div class="space-y-5">
          <h2 class="font-serif-heading font-bold text-lg text-cozy-text">2. Attributes & Tags</h2>
          
          <!-- MULTI-SELECT DRINK COLORS -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-2">
              Drink Color(s) <span class="text-cozy-muted font-normal">(Select 1 or more for multi-colored/layered drinks)</span>
            </label>
            <div id="recipe-color-checkboxes" class="flex flex-wrap gap-2">
              <!-- Dynamically populated multi-select checkboxes -->
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 pt-2">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Temperature</label>
              <select id="recipe-temp" class="w-full px-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-xs font-medium">
                <!-- TAXONOMY.TEMPERATURES -->
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Primary Taste</label>
              <select id="recipe-taste" class="w-full px-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-xs font-medium">
                <!-- TAXONOMY.TASTES -->
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Season</label>
              <select id="recipe-season" class="w-full px-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-xs font-medium">
                <!-- TAXONOMY.SEASONS -->
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Prep Time Tier</label>
              <select id="recipe-preptime" class="w-full px-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-xs font-medium">
                <!-- TAXONOMY.PREP_TIMES -->
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-1">Prep Duration Label</label>
            <input type="text" id="recipe-minutes" placeholder="e.g. 5 mins" class="w-full max-w-xs px-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-xs font-medium" />
          </div>
        </div>

        <hr class="border-cozy-border" />

        <!-- 3. INGREDIENTS WITH SEARCH AUTOCOMPLETE -->
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="font-serif-heading font-bold text-lg text-cozy-text">3. Ingredients</h2>
              <p class="text-xs text-cozy-muted">Search existing pantry items or type custom ingredients</p>
            </div>
            <button type="button" onclick="addIngredientRow()" class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-3 py-1.5 rounded-full hover:bg-cozy-olivegreen hover:text-white transition">
              + Add Ingredient
            </button>
          </div>

          <div id="ingredients-inputs-container" class="space-y-3">
            <!-- Dynamic ingredient rows -->
          </div>
        </div>

        <hr class="border-cozy-border" />

        <!-- 4. INSTRUCTIONS STEPS -->
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="font-serif-heading font-bold text-lg text-cozy-text">4. Preparation Steps</h2>
            <button type="button" onclick="addInstructionRow()" class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-3 py-1.5 rounded-full hover:bg-cozy-olivegreen hover:text-white transition">
              + Add Step
            </button>
          </div>

          <div id="instructions-inputs-container" class="space-y-3">
            <!-- Dynamic step rows -->
          </div>
        </div>

        <hr class="border-cozy-border" />

        <!-- SUBMIT ACTIONS -->
        <div class="pt-4 flex items-center justify-end gap-3">
          <a href="recipes.html" class="px-6 py-3 rounded-full border border-cozy-border text-cozy-muted text-sm font-semibold hover:text-cozy-text transition">
            Cancel
          </a>
          <button type="submit" class="px-8 py-3 rounded-full bg-cozy-olivegreen text-white font-semibold text-sm hover:bg-cozy-olivegreen-hover transition shadow-md">
            Save Recipe ✨
          </button>
        </div>

      </form>

    </div>

  </main>

  <footer id="site-footer"></footer>

  <<script src="constants.js"></script>
  <script src="common.js"></script>
  <script src="recipes.js"></script>

  <script>
    let editModeId = null;

    document.addEventListener('DOMContentLoaded', () => {
      initFormTaxonomy();
      checkForEditMode();

      // If creating a brand new recipe, add 1 empty starting row for ingredients & steps
      if (!editModeId) {
        if (document.querySelectorAll('.ingredient-row').length === 0) addIngredientRow();
        if (document.querySelectorAll('.instruction-row').length === 0) addInstructionRow();
      }
    });

    function normalizeString(str) {
      if (!str) return '';
      return str.toString().toLowerCase().trim().replace(/[^\w\s-]/g, '').replace(/[\s_-]+/g, '-');
    }

    // 1. Populate all Dropdowns & Color Checkboxes from TAXONOMY in constants.js
    function initFormTaxonomy() {
      if (typeof TAXONOMY === 'undefined') return;

      populateSelect('recipe-style', TAXONOMY.STYLES || TAXONOMY.DRINK_STYLES);
      populateSelect('recipe-temp', TAXONOMY.TEMPERATURES);
      populateSelect('recipe-taste', TAXONOMY.PRIMARY_TASTES || TAXONOMY.TASTES);
      populateSelect('recipe-season', TAXONOMY.SEASONS);
      populateSelect('recipe-preptime', TAXONOMY.PREP_TIMES);

      // Multi-select Color Pills
      const colorBox = document.getElementById('recipe-color-checkboxes');
      if (colorBox && TAXONOMY.COLORS) {
        colorBox.innerHTML = TAXONOMY.COLORS.map(c => {
          const val = typeof c === 'object' ? c.value : c;
          const label = typeof c === 'object' ? c.label : c;
          return `
            <label class="cursor-pointer select-none">
              <input type="checkbox" name="recipe-color" value="${val}" class="sr-only peer" />
              <span class="inline-block text-xs font-semibold px-3 py-1.5 rounded-full border border-cozy-border bg-cozy-bg text-cozy-text peer-checked:bg-cozy-olivegreen peer-checked:text-white peer-checked:border-cozy-olivegreen hover:border-cozy-olivegreen/60 transition-all duration-150 shadow-sm">
                ${label}
              </span>
            </label>
          `;
        }).join('');
      }

      // Populate Pantry Datalist for Ingredient Autocomplete if available
      const datalist = document.getElementById('pantry-ingredients-list');
      if (datalist && typeof TAXONOMY.ALL_INGREDIENTS !== 'undefined') {
        datalist.innerHTML = TAXONOMY.ALL_INGREDIENTS.map(i => `<option value="${i}">`).join('');
      }
    }

    function populateSelect(elementId, items) {
      const select = document.getElementById(elementId);
      if (!select || !items) return;
      
      let html = '<option value="">-- Select --</option>';
      html += items.map(item => {
        const val = typeof item === 'object' ? item.value : item;
        const label = typeof item === 'object' ? item.label : item;
        return `<option value="${val}">${label}</option>`;
      }).join('');
      
      select.innerHTML = html;
    }

    // 2. Pre-fill All Form Fields in Edit Mode
    function checkForEditMode() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawEditId = urlParams.get('edit');

      if (!rawEditId) return; // Standard "Add Recipe" mode

      editModeId = decodeURIComponent(rawEditId).trim();
      const targetSlug = normalizeString(editModeId);

      // Fetch recipe from recipes.js + browser localStorage
      let allRecipes = [];
      if (typeof getCombinedRecipes === 'function') {
        try { allRecipes = getCombinedRecipes(); } catch(e) {}
      }
      if (!allRecipes || allRecipes.length === 0) {
        allRecipes = (typeof ALL_RECIPES !== 'undefined') ? [...ALL_RECIPES] : [];
      }

      const recipeToEdit = allRecipes.find(r => {
        if (!r) return false;
        const rId = normalizeString(r.id);
        const rName = normalizeString(r.name);
        return rId === targetSlug || rName === targetSlug;
      });

      if (!recipeToEdit) return;

      // Update Page Heading & Submit Button
      const pageHeading = document.querySelector('h1');
      if (pageHeading) pageHeading.innerText = `Edit "${recipeToEdit.name}"`;

      const submitBtn = document.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.innerText = '💾 Save Changes ✨';

      // Pre-fill Text Fields & Selects
      setVal('recipe-name', recipeToEdit.name);
      setVal('recipe-style', recipeToEdit.style);
      setVal('recipe-description', recipeToEdit.description);
      setVal('recipe-temp', recipeToEdit.temperature);
      setVal('recipe-taste', recipeToEdit.primaryTaste);
      setVal('recipe-season', recipeToEdit.season);
      setVal('recipe-preptime', recipeToEdit.prepTime);
      setVal('recipe-minutes', recipeToEdit.prepMinutes || recipeToEdit.prepTime);

      // Pre-check Active Colors
      if (recipeToEdit.color) {
        const colors = Array.isArray(recipeToEdit.color) ? recipeToEdit.color : [recipeToEdit.color];
        document.querySelectorAll('input[name="recipe-color"]').forEach(cb => {
          cb.checked = colors.some(c => c.toLowerCase() === cb.value.toLowerCase());
        });
      }

      // Pre-fill Dynamic Ingredient Rows
      if (Array.isArray(recipeToEdit.ingredients)) {
        populateIngredients(recipeToEdit.ingredients);
      }

      // Pre-fill Dynamic Instruction Steps
      if (Array.isArray(recipeToEdit.instructions)) {
        populateInstructions(recipeToEdit.instructions);
      }
    }

    function setVal(id, val) {
      const el = document.getElementById(id);
      if (el && val !== undefined && val !== null) {
        el.value = val;
      }
    }

    // 3. Dynamic Ingredient Row Helpers
    function addIngredientRow(ing = {}) {
      const container = document.getElementById('ingredients-inputs-container');
      if (!container) return;

      const row = document.createElement('div');
      row.className = 'flex items-center gap-2 ingredient-row';
      row.innerHTML = `
        <input 
          type="text" 
          name="ingredient_name" 
          list="pantry-ingredients-list"
          placeholder="Ingredient (e.g. Lime Juice)" 
          value="${ing.name || ''}" 
          class="flex-1 px-3 py-2 bg-cozy-bg border border-cozy-border rounded-xl text-xs font-medium text-cozy-text focus:outline-none focus:border-cozy-olivegreen"
          required 
        />
        <input 
          type="number" 
          step="any" 
          name="ingredient_amount" 
          placeholder="Amount" 
          value="${ing.amount !== undefined ? ing.amount : ''}" 
          class="w-20 px-3 py-2 bg-cozy-bg border border-cozy-border rounded-xl text-xs font-medium text-cozy-text focus:outline-none focus:border-cozy-olivegreen"
        />
        <input 
          type="text" 
          name="ingredient_unit" 
          placeholder="Unit (grams, tbsp)" 
          value="${ing.unit || ''}" 
          class="w-28 px-3 py-2 bg-cozy-bg border border-cozy-border rounded-xl text-xs font-medium text-cozy-text focus:outline-none focus:border-cozy-olivegreen"
        />
        <button type="button" onclick="this.parentElement.remove()" class="text-xs text-red-500 hover:text-red-700 p-2 font-bold">✕</button>
      `;
      container.appendChild(row);
    }

    function populateIngredients(ingredients) {
      const container = document.getElementById('ingredients-inputs-container');
      if (!container) return;
      container.innerHTML = '';
      ingredients.forEach(ing => addIngredientRow(ing));
    }

    // 4. Dynamic Instruction Row Helpers
    function addInstructionRow(stepText = '') {
      const container = document.getElementById('instructions-inputs-container');
      if (!container) return;

      const stepNum = container.children.length + 1;
      const row = document.createElement('div');
      row.className = 'flex items-start gap-2 instruction-row';
      row.innerHTML = `
        <span class="text-xs font-bold text-cozy-olivegreen bg-cozy-olivegreen/10 rounded-full w-6 h-6 flex items-center justify-center shrink-0 mt-2">${stepNum}</span>
        <textarea 
          name="instruction_step" 
          rows="2" 
          placeholder="Describe this step..." 
          class="flex-1 px-3 py-2 bg-cozy-bg border border-cozy-border rounded-xl text-xs font-medium text-cozy-text focus:outline-none focus:border-cozy-olivegreen"
          required
        >${stepText}</textarea>
        <button type="button" onclick="this.parentElement.remove(); renumberInstructions();" class="text-xs text-red-500 hover:text-red-700 p-2 font-bold mt-1">✕</button>
      `;
      container.appendChild(row);
    }

    function populateInstructions(instructions) {
      const container = document.getElementById('instructions-inputs-container');
      if (!container) return;
      container.innerHTML = '';
      instructions.forEach(step => addInstructionRow(step));
    }

    function renumberInstructions() {
      const container = document.getElementById('instructions-inputs-container');
      if (!container) return;
      Array.from(container.children).forEach((row, idx) => {
        const badge = row.querySelector('span');
        if (badge) badge.innerText = idx + 1;
      });
    }

    // 5. Form Submit Handler (Saves to localStorage)
    function handleSaveRecipe(e) {
      e.preventDefault();

      const selectedColors = Array.from(document.querySelectorAll('input[name="recipe-color"]:checked')).map(cb => cb.value);

      const ingRows = document.querySelectorAll('.ingredient-row');
      const ingredients = Array.from(ingRows).map(row => {
        const name = row.querySelector('input[name="ingredient_name"]').value.trim();
        const amountVal = row.querySelector('input[name="ingredient_amount"]').value;
        const unit = row.querySelector('input[name="ingredient_unit"]').value.trim();
        const amount = amountVal !== '' ? parseFloat(amountVal) : 1;
        return { name, amount, unit };
      }).filter(i => i.name);

      const instRows = document.querySelectorAll('.instruction-row');
      const instructions = Array.from(instRows).map(row => {
        return row.querySelector('textarea[name="instruction_step"]').value.trim();
      }).filter(s => s);

      const name = document.getElementById('recipe-name').value.trim();
      const style = document.getElementById('recipe-style').value;
      const description = document.getElementById('recipe-description').value.trim();
      const temperature = document.getElementById('recipe-temp').value;
      const primaryTaste = document.getElementById('recipe-taste').value;
      const season = document.getElementById('recipe-season').value;
      const prepTime = document.getElementById('recipe-preptime').value;
      const prepMinutes = document.getElementById('recipe-minutes').value.trim() || '5 mins';

      const recipeId = editModeId || normalizeString(name);

      const newRecipe = {
        id: recipeId,
        name: name,
        style: style,
        description: description,
        temperature: temperature,
        color: selectedColors.length > 0 ? selectedColors : ['Custom'],
        primaryTaste: primaryTaste,
        season: season,
        prepTime: prepTime,
        prepMinutes: prepMinutes,
        ingredients: ingredients,
        instructions: instructions
      };

      let customRecipes = JSON.parse(localStorage.getItem('cozy_custom_recipes') || '[]');

      if (editModeId) {
        const idx = customRecipes.findIndex(r => normalizeString(r.id || r.name) === normalizeString(editModeId));
        if (idx !== -1) {
          customRecipes[idx] = newRecipe;
        } else {
          customRecipes.push(newRecipe);
        }
      } else {
        customRecipes.push(newRecipe);
      }

      localStorage.setItem('cozy_custom_recipes', JSON.stringify(customRecipes));

      // Redirect back to the recipe detail view
      window.location.href = `recipe.html?id=${encodeURIComponent(recipeId)}`;
    }
  </script>
</body>
</html>
