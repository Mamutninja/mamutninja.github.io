<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Detail — StillSip</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="images/icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="constants.js"></script>
  <script src="common.js"></script>
  <script src="recipes.js"></script> <!-- ADDED CRITICAL RECIPE SCRIPT -->
</head>
<body class="min-h-screen flex flex-col">

  <header id="site-header"></header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    <!-- Top Action Bar -->
    <div class="flex items-center justify-between mb-6">
      <a href="recipes.html" class="inline-flex items-center gap-2 text-sm font-medium text-cozy-muted hover:text-cozy-olivegreen transition">← Back to all recipes</a>
      <button id="favorite-btn" onclick="toggleFavorite()" class="px-4 py-2 rounded-full border border-cozy-border bg-white text-sm font-medium text-cozy-text hover:border-cozy-olivegreen transition shadow-sm flex gap-2">
        <span id="fav-icon">🤍</span> <span id="fav-text">Save to Favorites</span>
      </button>
    </div>

    <!-- Main Header Card -->
    <div class="cozy-card rounded-cozy p-6 md:p-8 mb-8">
      <div class="flex flex-wrap items-center gap-2 mb-3">
        <span id="recipe-style" class="px-3 py-1 rounded-full text-xs font-semibold bg-cozy-olivegreen/10 text-cozy-olivegreen inline-block">Style</span>
        <span id="recipe-prep-time" class="px-3 py-1 rounded-full text-xs font-semibold bg-cozy-bg text-cozy-muted border border-cozy-border inline-block">⏱️ 5 mins</span>
        <span id="recipe-color" class="px-3 py-1 rounded-full text-xs font-semibold bg-cozy-bg text-cozy-muted border border-cozy-border inline-block">🎨 Color</span>
        <span id="recipe-taste" class="px-3 py-1 rounded-full text-xs font-semibold bg-cozy-bg text-cozy-muted border border-cozy-border inline-block">👅 Taste</span>
      </div>
      <h1 id="recipe-title" class="font-serif-heading text-3xl md:text-5xl font-bold text-cozy-text mb-4">Recipe Title</h1>
      <p id="recipe-description" class="text-cozy-muted text-base md:text-lg mb-4 leading-relaxed"></p>
      
      <!-- Pro Tip Box -->
      <div class="bg-cozy-bg/60 border border-cozy-border/60 rounded-xl p-3.5 text-xs text-cozy-text flex items-start gap-2">
        <span>💡</span>
        <p><strong class="font-semibold">Pro Tip:</strong> <span id="recipe-tip">Enjoy your creation!</span></p>
      </div>
    </div>

    <!-- Recipe Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Ingredients Column -->
      <div class="lg:col-span-5 space-y-6">
        <div class="cozy-card rounded-cozy p-6">
          <div class="flex items-center justify-between mb-6 pb-4 border-b border-cozy-border">
            <h2 class="font-serif-heading font-bold text-xl text-cozy-text">Ingredients</h2>
            <div class="flex items-center gap-2 bg-cozy-bg px-2.5 py-1 rounded-xl border border-cozy-border">
              <button onclick="updateServings(-1)" class="text-xs font-bold text-cozy-muted hover:text-cozy-olivegreen px-1.5 py-0.5">ー</button>
              <span id="servings-count" class="text-xs font-bold text-cozy-olivegreen">1</span>
              <span class="text-xs text-cozy-muted font-medium">servings</span>
              <button onclick="updateServings(1)" class="text-xs font-bold text-cozy-muted hover:text-cozy-olivegreen px-1.5 py-0.5">＋</button>
            </div>
          </div>
          
          <ul id="recipe-ingredients" class="space-y-3 mb-6"></ul>
          
          <button id="add-missing-btn" onclick="addMissingToShoppingList()" class="w-full py-3 rounded-xl bg-cozy-olivegreen hover:bg-cozy-olivegreen-hover text-white font-medium text-sm transition shadow-sm">
            🛒 Add Missing Items to Shopping List
          </button>
        </div>
      </div>

      <!-- Preparation Steps Column -->
      <div class="lg:col-span-7">
        <div class="cozy-card rounded-cozy p-6 md:p-8">
          <h2 class="font-serif-heading font-bold text-2xl text-cozy-text mb-6 pb-4 border-b border-cozy-border">Preparation Steps</h2>
          <ol id="recipe-instructions" class="space-y-4"></ol>
        </div>
      </div>

    </div>
  </main>

  <footer id="site-footer"></footer>

  <script>
    let currentRecipe = null;
    let currentServings = 1;

    document.addEventListener('DOMContentLoaded', () => {
      loadRecipeDetail();
    });

    function slugify(text) {
      if (!text) return '';
      return text
        .toString()
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, '')
        .replace(/[\s_-]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function getAllStoredRecipes() {
      let recipes = [];

      if (typeof getCombinedRecipes === 'function') {
        try { recipes = getCombinedRecipes(); } catch(e) {}
      }

      if (!recipes || recipes.length === 0) {
        recipes = (typeof ALL_RECIPES !== 'undefined') ? [...ALL_RECIPES] : [];
      }

      const keysToCheck = [
        'cozy_custom_recipes',
        'custom_recipes',
        'customRecipes',
        'cozy_recipes',
        'recipes'
      ];

      keysToCheck.forEach(key => {
        try {
          const item = localStorage.getItem(key);
          if (item) {
            const parsed = JSON.parse(item);
            if (Array.isArray(parsed)) {
              recipes.push(...parsed);
            }
          }
        } catch (e) {}
      });

      const uniqueMap = new Map();
      recipes.forEach(r => {
        if (!r) return;
        const key = (r.id || r.name || '').trim().toLowerCase();
        if (key && !uniqueMap.has(key)) {
          uniqueMap.set(key, r);
        }
      });

      return Array.from(uniqueMap.values());
    }

    function loadRecipeDetail() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawId = urlParams.get('id');

      if (!rawId) {
        showNotFoundError("No recipe ID specified in the URL.");
        return;
      }

      const decodedId = decodeURIComponent(rawId).trim();
      const targetSlug = slugify(decodedId);
      const allRecipes = getAllStoredRecipes();

      currentRecipe = allRecipes.find(r => {
        if (!r) return false;
        const rId = (r.id || '').trim();
        const rName = (r.name || '').trim();

        return (
          rId.toLowerCase() === decodedId.toLowerCase() ||
          rName.toLowerCase() === decodedId.toLowerCase() ||
          slugify(rId) === targetSlug ||
          slugify(rName) === targetSlug
        );
      });

      if (!currentRecipe) {
        showNotFoundError(`Recipe "${decodedId}" could not be found.`);
        return;
      }

      renderRecipePage(currentRecipe);
    }

    function renderRecipePage(r) {
      document.title = `${r.name} — StillSip`;
      
      const setElText = (id, text) => {
        const el = document.getElementById(id);
        if (el) el.innerText = text;
      };

      setElText('recipe-title', r.name || 'Untitled Recipe');
      setElText('recipe-style', r.style || 'Drink');
      setElText('recipe-description', r.description || '');
      setElText('recipe-prep-time', `⏱️ ${r.prepMinutes || r.prepTime || '5 mins'}`);
      
      const colors = Array.isArray(r.color) ? r.color.join(', ') : (r.color || 'Custom');
      setElText('recipe-color', `🎨 ${colors}`);
      setElText('recipe-taste', `👅 ${r.primaryTaste || 'Fresh'}`);
      setElText('recipe-tip', r.tip || 'Enjoy your creation!');

      renderIngredients();

      const stepsContainer = document.getElementById('recipe-instructions');
      if (stepsContainer && Array.isArray(r.instructions)) {
        stepsContainer.innerHTML = r.instructions.map((step, idx) => `
          <li class="flex items-start gap-3 p-3.5 rounded-xl bg-cozy-bg/50 border border-cozy-border">
            <span class="font-bold text-xs text-white bg-cozy-olivegreen rounded-full w-6 h-6 flex items-center justify-center shrink-0 mt-0.5">
              ${idx + 1}
            </span>
            <p class="text-sm text-cozy-text font-medium leading-relaxed">${step}</p>
          </li>
        `).join('');
      }
    }

    function renderIngredients() {
      if (!currentRecipe || !currentRecipe.ingredients) return;
      
      const ingContainer = document.getElementById('recipe-ingredients');
      if (!ingContainer) return;

      const pantry = (typeof State !== 'undefined' && State.getPantry) ? State.getPantry() : [];

      ingContainer.innerHTML = currentRecipe.ingredients.map(ing => {
        const amt = (typeof ing.amount === 'number') ? ing.amount : parseFloat(ing.amount) || 1;
        const scaledAmount = (amt * currentServings).toFixed(1).replace(/\.0$/, '');
        const inPantry = pantry.some(p => p.trim().toLowerCase() === ing.name.trim().toLowerCase());

        return `
          <li class="flex items-center justify-between p-3 rounded-xl border border-cozy-border bg-white">
            <div class="flex items-center gap-2">
              <span class="text-xs ${inPantry ? 'text-emerald-600 font-bold' : 'text-amber-600 font-medium'}">
                ${inPantry ? '✓ In Pantry' : '○ Missing'}
              </span>
              <span class="text-sm font-semibold text-cozy-text">${ing.name}</span>
            </div>
            <span class="text-xs font-bold text-cozy-olivegreen bg-cozy-olivegreen/10 px-2.5 py-1 rounded-md">
              ${scaledAmount} ${ing.unit || ''}
            </span>
          </li>
        `;
      }).join('');
    }

    function updateServings(delta) {
      currentServings = Math.max(1, currentServings + delta);
      const el = document.getElementById('servings-count');
      if (el) el.innerText = currentServings;
      renderIngredients();
    }

    function showNotFoundError(message) {
      const mainContent = document.querySelector('main');
      if (!mainContent) return;

      mainContent.innerHTML = `
        <div class="text-center py-20 max-w-md mx-auto">
          <span class="text-5xl block mb-4">🔍</span>
          <h1 class="font-serif-heading font-bold text-2xl text-cozy-text mb-2">Recipe Not Found</h1>
          <p class="text-cozy-muted text-sm mb-6">${message}</p>
          <a href="recipes.html" class="inline-block px-6 py-3 rounded-full bg-cozy-olivegreen text-white font-semibold text-xs hover:bg-cozy-olivegreen-hover transition shadow-md">
            ← Return to All Recipes
          </a>
        </div>
      `;
    }
  </script>
</body>
</html>
