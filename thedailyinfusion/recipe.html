<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Detail — StillSip</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="images/icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="common.js"></script>
</head>
<body class="min-h-screen flex flex-col">

  <header id="site-header"></header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <a href="recipes.html" class="inline-flex items-center gap-2 text-sm font-medium text-cozy-muted hover:text-cozy-olivegreen transition">← Back to all recipes</a>
      <button id="favorite-btn" onclick="toggleFavorite()" class="px-4 py-2 rounded-full border border-cozy-border bg-white text-sm font-medium text-cozy-text hover:border-cozy-olivegreen transition shadow-sm flex gap-2">
        <span id="fav-icon">🤍</span> <span id="fav-text">Save to Favorites</span>
      </button>
    </div>

    <div class="cozy-card rounded-cozy p-6 md:p-8 mb-8">
      <span id="recipe-style" class="px-3 py-1 rounded-full text-xs font-semibold bg-cozy-olivegreen/10 text-cozy-olivegreen inline-block mb-3">Style</span>
      <h1 id="recipe-title" class="font-serif-heading text-3xl md:text-5xl font-bold text-cozy-text mb-4">Recipe Title</h1>
      <p id="recipe-description" class="text-cozy-muted text-base md:text-lg mb-6"></p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <div class="lg:col-span-5 space-y-6">
        <div class="cozy-card rounded-cozy p-6">
          <div class="flex items-center justify-between mb-6 pb-4 border-b border-cozy-border">
            <h2 class="font-serif-heading font-bold text-xl text-cozy-text">Ingredients</h2>
            <div class="flex gap-1 bg-cozy-bg p-1 rounded-xl border border-cozy-border">
              <button onclick="updateServings(1)" class="servings-btn w-8 h-8 rounded-lg text-xs font-bold bg-cozy-olivegreen text-white" data-scale="1">1x</button>
              <button onclick="updateServings(2)" class="servings-btn w-8 h-8 rounded-lg text-xs font-bold text-cozy-muted" data-scale="2">2x</button>
            </div>
          </div>
          <ul id="ingredients-list" class="space-y-3 mb-6"></ul>
          <button id="add-missing-btn" onclick="addMissingToShoppingList()" class="w-full py-3 rounded-xl bg-cozy-sage text-white font-medium text-sm transition">🛒 Add Missing Items to Shopping List</button>
        </div>
      </div>

      <div class="lg:col-span-7">
        <div class="cozy-card rounded-cozy p-6 md:p-8">
          <h2 class="font-serif-heading font-bold text-2xl text-cozy-text mb-6 pb-4 border-b border-cozy-border">Preparation Steps</h2>
          <ol id="instructions-list" class="space-y-6"></ol>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="recipes.js"></script>
  <script>
    let currentRecipe = null;
    let currentServingsScale = 1;
    let favorites = State.getFavorites();

    document.addEventListener('DOMContentLoaded', () => {
      const recipeId = new URLSearchParams(window.location.search).get('id') || 'cucumber-mint-agua-fresca';
      currentRecipe = ALL_RECIPES.find(r => r.id === recipeId) || ALL_RECIPES[0];

      document.title = `${currentRecipe.name} — StillSip`;
      document.getElementById('recipe-title').innerText = currentRecipe.name;
      document.getElementById('recipe-style').innerText = currentRecipe.style;
      document.getElementById('recipe-description').innerText = currentRecipe.description;

      updateFavUI();
      renderIngredients();

      document.getElementById('instructions-list').innerHTML = currentRecipe.instructions.map((step, idx) => `
        <li class="flex items-start gap-4">
          <span class="text-cozy-olivegreen font-bold">Step ${idx + 1}:</span>
          <span class="text-cozy-text leading-relaxed">${step}</span>
        </li>
      `).join('');
    });

    function renderIngredients() {
      const pantry = State.getPantry();
      document.getElementById('ingredients-list').innerHTML = currentRecipe.ingredients.map(ing => {
        const inPantry = pantry.some(p => p.toLowerCase() === ing.name.toLowerCase());
        return `
          <li class="flex items-center justify-between p-2.5 rounded-xl border ${inPantry ? 'bg-cozy-sage/10 border-cozy-sage/30' : 'bg-white border-cozy-border'}">
            <span class="text-sm font-medium text-cozy-text">${ing.name}</span>
            <span class="text-sm font-bold text-cozy-olivegreen">${ing.amount * currentServingsScale} ${ing.unit}</span>
          </li>
        `;
      }).join('');
    }

    function updateServings(scale) {
      currentServingsScale = scale;
      document.querySelectorAll('.servings-btn').forEach(btn => {
        btn.className = parseInt(btn.getAttribute('data-scale')) === scale ? "servings-btn w-8 h-8 rounded-lg text-xs font-bold bg-cozy-olivegreen text-white" : "servings-btn w-8 h-8 rounded-lg text-xs font-bold text-cozy-muted";
      });
      renderIngredients();
    }

    function toggleFavorite() {
      favorites = favorites.includes(currentRecipe.id) ? favorites.filter(id => id !== currentRecipe.id) : [...favorites, currentRecipe.id];
      State.saveFavorites(favorites);
      updateFavUI();
    }

    function updateFavUI() {
      const isFav = favorites.includes(currentRecipe.id);
      document.getElementById('fav-icon').innerText = isFav ? '❤️' : '🤍';
      document.getElementById('fav-text').innerText = isFav ? 'Saved in Favorites' : 'Save to Favorites';
    }

    function addMissingToShoppingList() {
      const pantry = State.getPantry();
      const list = State.getShoppingList();

      currentRecipe.ingredients.forEach(ing => {
        const inPantry = pantry.some(p => p.toLowerCase() === ing.name.toLowerCase());
        const inList = list.some(item => item.name.toLowerCase() === ing.name.toLowerCase());
        if (!inPantry && !inList) {
          list.push({ name: ing.name, amount: `${ing.amount * currentServingsScale} ${ing.unit}` });
        }
      });

      State.saveShoppingList(list);
    }
  </script>
</body>
</html>
