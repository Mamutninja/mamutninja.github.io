<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Drink Recipes — StillSip</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/icon.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Shared Theme & Styles -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="constants.js"></script>
  <script src="common.js"></script>
</head>
<body class="min-h-screen flex flex-col relative">

  <!-- DYNAMIC NAVIGATION HEADER -->
  <header id="site-header"></header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
    
    <!-- PAGE HERO HEADER -->
    <div class="text-left mb-8 border-b border-cozy-border pb-6 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-serif-heading text-3xl md:text-4xl font-bold text-cozy-text mb-2">All Drink Recipes</h1>
        <p class="text-cozy-muted text-base">Filter and discover non-alcoholic, still beverages tailored to your tastes.</p>
      </div>
      <button onclick="resetAllFilters()" class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-4 py-2 rounded-full hover:bg-cozy-olivegreen hover:text-white transition">
        ↺ Reset All Filters
      </button>
      <div class="flex items-center gap-2">
  <button onclick="exportRecipesJS()" class="text-xs font-semibold text-cozy-text bg-white border border-cozy-border px-4 py-2 rounded-full hover:border-cozy-olivegreen transition flex items-center gap-1.5 shadow-sm">
    <span>💾</span> Download Updated recipes.js
  </button>

  <button onclick="resetAllFilters()" class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-4 py-2 rounded-full hover:bg-cozy-olivegreen hover:text-white transition">
    ↺ Reset All Filters
  </button>
</div>
    </div>

    <!-- MAIN TWO-COLUMN LAYOUT -->
    <div class="flex flex-col lg:flex-row gap-8 items-start">
      
      <!-- LEFT SIDEBAR: DYNAMIC 9-CATEGORY FILTERS -->
      <aside class="w-full lg:w-80 shrink-0 lg:sticky lg:top-20 max-h-[85vh] overflow-y-auto pr-1">
        <div class="cozy-card rounded-cozy p-5 space-y-6">
          
          <!-- SEARCH KEYWORD -->
          <div>
            <label for="search-input" class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-2">Search Keyword</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-cozy-muted text-sm">🔍</span>
              <input 
                type="text" 
                id="search-input" 
                placeholder="Mint, turmeric, lime..." 
                class="w-full pl-9 pr-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-cozy-text text-sm focus:outline-none focus:border-cozy-olivegreen transition" 
                oninput="filterRecipes()"
              />
            </div>
          </div>

          <hr class="border-cozy-border" />

          <!-- DYNAMIC FILTER CONTAINER -->
          <div id="dynamic-filters-container" class="space-y-6">
            <!-- Dynamically populated from TAXONOMY in constants.js -->
          </div>

          <!-- COUNT INDICATOR -->
          <div class="pt-3 border-t border-cozy-border flex items-center justify-between">
            <span id="recipe-count" class="text-xs font-semibold text-cozy-muted">Showing 0 recipes</span>
          </div>

        </div>
      </aside>

      <!-- RIGHT COLUMN: RECIPE GRID -->
      <div class="flex-1 w-full">
        
        <!-- ACTIVE BADGES CONTAINER -->
        <div id="active-badges-container" class="hidden mb-4 flex flex-wrap items-center gap-2">
          <span class="text-xs text-cozy-muted font-medium">Active Filters:</span>
          <div id="active-badges" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- RECIPE CARDS GRID -->
        <div id="recipe-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6"></div>

        <!-- EMPTY STATE -->
        <div id="empty-state" class="hidden text-center py-16 cozy-card rounded-cozy">
          <span class="text-4xl block mb-3">🫖</span>
          <h3 class="font-serif-heading font-bold text-xl text-cozy-text mb-1">No matching recipes</h3>
          <p class="text-cozy-muted text-sm max-w-sm mx-auto mb-4">Try clearing some filters to broaden your search.</p>
          <button onclick="resetAllFilters()" class="px-4 py-2 bg-cozy-olivegreen text-white rounded-full text-xs font-semibold hover:bg-cozy-olivegreen-hover transition">Reset All Filters</button>
        </div>

      </div>

    </div>
  </main>

  <!-- ALIGNED FLOATING ADD RECIPE BUTTON -->
  <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-full max-w-7xl px-4 flex justify-end pointer-events-none z-40">
    <a 
      href="add-recipe.html" 
      title="Add New Recipe" 
      class="pointer-events-auto w-14 h-14 rounded-full bg-cozy-olivegreen text-white flex items-center justify-center shadow-lg hover:bg-cozy-olivegreen-hover hover:scale-110 active:scale-95 transition-all duration-200 group relative"
    >
      <svg class="w-8 h-8 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      
      <!-- Hover Tooltip -->
      <span class="absolute right-16 bg-cozy-text text-white text-xs font-semibold px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap shadow-md pointer-events-none">
        Add New Recipe
      </span>
    </a>
  </div>

  <!-- DYNAMIC FOOTER -->
  <footer id="site-footer"></footer>

  <!-- RECIPE DATABASE & LOGIC -->
  <script src="recipes.js"></script>
  <script>
    // State map for selected filters across all categories
    let selectedFilters = {
      temperature: [],
      color: [],
      healthiness: [],
      nutrients: [],
      useCases: [],
      primaryTaste: [],
      season: [],
      style: [],
      prepTime: []
    };

    let favorites = State.getFavorites();

    document.addEventListener('DOMContentLoaded', () => {
      renderSidebarFilters();
      filterRecipes();
    });

    // RENDER ALL 9 FILTER CATEGORIES DYNAMICALLY FROM CONSTANTS.JS
    function renderSidebarFilters() {
      const container = document.getElementById('dynamic-filters-container');
      
      const categoryDefinitions = [
        { title: "1. Temperature", key: "temperature", data: TAXONOMY.TEMPERATURES },
        { title: "2. Color", key: "color", data: TAXONOMY.COLORS },
        { title: "3. Healthiness & Dietary", key: "healthiness", data: TAXONOMY.HEALTHINESS },
        { title: "4. Nutrients & Actives", key: "nutrients", data: TAXONOMY.NUTRIENTS },
        { title: "5. Use / Functional Goal", key: "useCases", data: TAXONOMY.USE_CASES },
        { title: "6. Primary Taste", key: "primaryTaste", data: TAXONOMY.TASTES },
        { title: "7. Season", key: "season", data: TAXONOMY.SEASONS },
        { title: "8. Drink Style", key: "style", data: TAXONOMY.STYLES },
        { title: "9. Prep Time", key: "prepTime", data: TAXONOMY.PREP_TIMES }
      ];

      container.innerHTML = categoryDefinitions.map(cat => `
        <div data-category-group="${cat.key}">
          <label class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-2">${cat.title}</label>
          <div class="flex flex-wrap gap-1.5">
            ${cat.data.map(item => `
              <button 
                onclick="toggleFilter('${cat.key}', '${item.value}', this)" 
                class="filter-chip px-3 py-1 rounded-full border border-cozy-border text-xs font-medium bg-cozy-bg text-cozy-text transition"
              >
                ${item.label}
              </button>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function toggleFilter(category, value, buttonEl) {
      const idx = selectedFilters[category].indexOf(value);
      if (idx > -1) {
        selectedFilters[category].splice(idx, 1);
        buttonEl.classList.remove('active');
      } else {
        selectedFilters[category].push(value);
        buttonEl.classList.add('active');
      }
      filterRecipes();
    }

    function filterRecipes() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const allRecipes = getCombinedRecipes(); // Combines built-in + user-created drinks

      const filtered = allRecipes.filter(recipe => {
        // Keyword Search Match
        const matchesQuery = query === '' || 
          recipe.name.toLowerCase().includes(query) || 
          recipe.ingredients.some(i => i.name.toLowerCase().includes(query)) ||
          recipe.description.toLowerCase().includes(query);

        if (!matchesQuery) return false;

        // Category Filter Matches
        for (const [catKey, selectedValues] of Object.entries(selectedFilters)) {
          if (selectedValues.length === 0) continue;
          
          const recipeVal = recipe[catKey];
          if (!recipeVal) return false;

          const hasMatch = Array.isArray(recipeVal) 
            ? selectedValues.some(val => recipeVal.includes(val)) 
            : selectedValues.includes(recipeVal);

          if (!hasMatch) return false;
        }

        return true;
      });

      renderGrid(filtered);
      renderActiveBadges();
    }

    function resetAllFilters() {
      selectedFilters = {
        temperature: [], color: [], healthiness: [], nutrients: [],
        useCases: [], primaryTaste: [], season: [], style: [], prepTime: []
      };
      document.getElementById('search-input').value = '';
      document.querySelectorAll('.filter-chip').forEach(btn => btn.classList.remove('active'));
      filterRecipes();
    }

    function renderActiveBadges() {
      const container = document.getElementById('active-badges-container');
      const badgesBox = document.getElementById('active-badges');
      let activeList = [];

      for (const [cat, vals] of Object.entries(selectedFilters)) {
        vals.forEach(v => activeList.push({ cat, v }));
      }

      if (activeList.length === 0) {
        container.classList.add('hidden');
        return;
      }

      container.classList.remove('hidden');
      badgesBox.innerHTML = activeList.map(item => `
        <span class="inline-flex items-center gap-1 text-xs bg-cozy-olivegreen text-white px-2.5 py-0.5 rounded-full font-medium shadow-sm">
          ${item.v}
          <button onclick="removeFilter('${item.cat}', '${item.v}')" class="ml-1 hover:text-black font-bold">✕</button>
        </span>
      `).join('');
    }

    function removeFilter(cat, val) {
      const idx = selectedFilters[cat].indexOf(val);
      if (idx > -1) selectedFilters[cat].splice(idx, 1);

      const groupEl = document.querySelector(`[data-category-group="${cat}"]`);
      if (groupEl) {
        groupEl.querySelectorAll('.filter-chip').forEach(btn => {
          if (btn.innerText.includes(val)) btn.classList.remove('active');
        });
      }
      filterRecipes();
    }

    function renderGrid(recipes) {
      const grid = document.getElementById('recipe-grid');
      const emptyState = document.getElementById('empty-state');
      document.getElementById('recipe-count').innerText = `Showing ${recipes.length} ${recipes.length === 1 ? 'recipe' : 'recipes'}`;

      if (recipes.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.innerHTML = recipes.map(r => `
        <div class="cozy-card rounded-cozy p-5 flex flex-col justify-between hover:-translate-y-1 transition-all duration-200">
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-2.5 py-0.5 rounded-full">${r.style}</span>
              <button onclick="toggleFav('${r.id}', event)" class="text-sm hover:scale-110 transition">${favorites.includes(r.id) ? '❤️' : '🤍'}</button>
            </div>
            <a href="recipe.html?id=${r.id}">
              <h3 class="font-serif-heading font-bold text-lg text-cozy-text hover:text-cozy-olivegreen transition mb-1">${r.name}</h3>
            </a>
            <p class="text-xs text-cozy-muted line-clamp-2 mb-3">${r.description}</p>
          </div>
          <a href="recipe.html?id=${r.id}" class="w-full py-2 rounded-xl border border-cozy-border bg-cozy-bg text-center text-xs font-medium text-cozy-text hover:bg-cozy-olivegreen hover:text-white transition">View Recipe →</a>
        </div>
      `).join('');
    }

    function toggleFav(id, event) {
      event.preventDefault();
      favorites = favorites.includes(id) ? favorites.filter(item => item !== id) : [...favorites, id];
      State.saveFavorites(favorites);
      filterRecipes();
    }
  </script>
</body>
</html>
