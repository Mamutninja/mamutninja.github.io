<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Drink Recipes — StillSip</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/icon.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Shared Theme & Styles -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="constants.js"></script>
  <script src="common.js"></script>
</head>
<body class="min-h-screen flex flex-col relative">

  <!-- DYNAMIC NAVIGATION HEADER -->
  <header id="site-header"></header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
    
    <!-- PAGE HERO HEADER -->
    <div class="text-left mb-8 border-b border-cozy-border pb-6 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-serif-heading text-3xl md:text-4xl font-bold text-cozy-text mb-2">All Drink Recipes</h1>
        <p class="text-cozy-muted text-base">Filter and discover non-alcoholic, still beverages tailored to your tastes.</p>
      </div>
      <button onclick="resetAllFilters()" class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-4 py-2 rounded-full hover:bg-cozy-olivegreen hover:text-white transition">
        ↺ Reset All Filters
      </button>
      <div class="flex items-center gap-2">
        <button onclick="exportRecipesJS()" class="text-xs font-semibold text-cozy-text bg-white border border-cozy-border px-4 py-2 rounded-full hover:border-cozy-olivegreen transition flex items-center gap-1.5 shadow-sm">
          <span>💾</span> Download Updated recipes.js
        </button>

        <button onclick="resetAllFilters()" class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-4 py-2 rounded-full hover:bg-cozy-olivegreen hover:text-white transition">
          ↺ Reset All Filters
        </button>
      </div>
    </div>

    <!-- MAIN TWO-COLUMN LAYOUT -->
    <div class="flex flex-col lg:flex-row gap-8 items-start">
      
      <!-- LEFT SIDEBAR: DYNAMIC 9-CATEGORY FILTERS -->
      <aside class="w-full lg:w-80 shrink-0 lg:sticky lg:top-20 max-h-[85vh] overflow-y-auto pr-1">
        <div class="cozy-card rounded-cozy p-5 space-y-6">
          
          <!-- SEARCH KEYWORD -->
          <div>
            <label for="search-input" class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-2">Search Keyword</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-cozy-muted text-sm">🔍</span>
              <input 
                type="text" 
                id="search-input" 
                placeholder="Mint, turmeric, lime..." 
                class="w-full pl-9 pr-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-cozy-text text-sm focus:outline-none focus:border-cozy-olivegreen transition" 
                oninput="filterRecipes()"
              />
            </div>
          </div>

          <hr class="border-cozy-border" />

          <!-- DYNAMIC FILTER CONTAINER -->
          <div id="dynamic-filters-container" class="space-y-6">
            <!-- Dynamically populated from TAXONOMY in constants.js -->
          </div>

          <!-- COUNT INDICATOR -->
          <div class="pt-3 border-t border-cozy-border flex items-center justify-between">
            <span id="recipe-count" class="text-xs font-semibold text-cozy-muted">Showing 0 recipes</span>
          </div>

        </div>
      </aside>

      <!-- RIGHT COLUMN: RECIPE GRID -->
      <div class="flex-1 w-full">
        
        <!-- ACTIVE BADGES CONTAINER -->
        <div id="active-badges-container" class="hidden mb-4 flex flex-wrap items-center gap-2">
          <span class="text-xs text-cozy-muted font-medium">Active Filters:</span>
          <div id="active-badges" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- RECIPE CARDS GRID -->
        <div id="recipe-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6"></div>

        <!-- EMPTY STATE -->
        <div id="empty-state" class="hidden text-center py-16 cozy-card rounded-cozy">
          <span class="text-4xl block mb-3">🫖</span>
          <h3 class="font-serif-heading font-bold text-xl text-cozy-text mb-1">No matching recipes</h3>
          <p class="text-cozy-muted text-sm max-w-sm mx-auto mb-4">Try clearing some filters to broaden your search.</p>
          <button onclick="resetAllFilters()" class="px-4 py-2 bg-cozy-olivegreen text-white rounded-full text-xs font-semibold hover:bg-cozy-olivegreen-hover transition">Reset All Filters</button>
        </div>

      </div>

    </div>
  </main>

  <!-- ALIGNED FLOATING ADD RECIPE BUTTON -->
  <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-full max-w-7xl px-4 flex justify-end pointer-events-none z-40">
    <a 
      href="add-recipe.html" 
      title="Add New Recipe" 
      class="pointer-events-auto w-14 h-14 rounded-full bg-cozy-olivegreen text-white flex items-center justify-center shadow-lg hover:bg-cozy-olivegreen-hover hover:scale-110 active:scale-95 transition-all duration-200 group relative"
    >
      <svg class="w-8 h-8 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      
      <!-- Hover Tooltip -->
      <span class="absolute right-16 bg-cozy-text text-white text-xs font-semibold px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap shadow-md pointer-events-none">
        Add New Recipe
      </span>
    </a>
  </div>

  <!-- DYNAMIC FOOTER -->
  <footer id="site-footer"></footer>

  <!-- RECIPE DATABASE & LOGIC -->
  <script src="recipes.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initCatalog();
    });

    // Helper: Combines built-in recipes.js with custom browser-saved recipes
    function getCombinedRecipes() {
      const builtin = (typeof ALL_RECIPES !== 'undefined') ? ALL_RECIPES : [];
      let custom = [];

      const keysToCheck = ['cozy_custom_recipes', 'custom_recipes', 'customRecipes', 'recipes'];
      keysToCheck.forEach(key => {
        try {
          const item = localStorage.getItem(key);
          if (item) {
            const parsed = JSON.parse(item);
            if (Array.isArray(parsed)) custom.push(...parsed);
          }
        } catch (e) {}
      });

      // Map to prevent duplicates
      const uniqueMap = new Map();
      [...builtin, ...custom].forEach(r => {
        if (!r) return;
        const key = (r.id || r.name || '').trim().toLowerCase();
        if (key && !uniqueMap.has(key)) {
          uniqueMap.set(key, r);
        }
      });

      return Array.from(uniqueMap.values());
    }

    function initCatalog() {
      const recipes = getCombinedRecipes();
      renderRecipeCards(recipes);

      // Search bar listener
      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => filterRecipes(e.target.value));
      }
    }

    function filterRecipes(query = '') {
      const recipes = getCombinedRecipes();
      const term = query.toLowerCase().trim();

      const filtered = recipes.filter(r => {
        if (!term) return true;
        const matchName = r.name && r.name.toLowerCase().includes(term);
        const matchStyle = r.style && r.style.toLowerCase().includes(term);
        const matchIng = r.ingredients && r.ingredients.some(i => i.name.toLowerCase().includes(term));
        return matchName || matchStyle || matchIng;
      });

      renderRecipeCards(filtered);
    }

    function renderRecipeCards(recipes) {
      const container = document.getElementById('recipe-grid');
      if (!container) return;

      if (recipes.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 text-cozy-muted">
            <span class="text-4xl block mb-2">🍵</span>
            <p class="font-medium text-sm">No recipes found.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = recipes.map(r => {
        const recipeId = r.id || r.name;
        const colors = Array.isArray(r.color) ? r.color.join(', ') : (r.color || 'Drink');
        const time = r.prepMinutes || r.prepTime || '5 mins';

        return `
          <a href="recipe.html?id=${encodeURIComponent(recipeId)}" 
             class="cozy-card block rounded-2xl p-5 hover:-translate-y-1 transition duration-200 group">
            <div class="flex justify-between items-start mb-3">
              <span class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-2.5 py-1 rounded-md">
                ${r.style || 'Drink'}
              </span>
              <span class="text-xs text-cozy-muted">⏱️ ${time}</span>
            </div>
            
            <h3 class="font-serif-heading font-bold text-lg text-cozy-text mb-2 group-hover:text-cozy-olivegreen transition">
              ${r.name}
            </h3>
            
            <p class="text-xs text-cozy-muted line-clamp-2 mb-4 leading-relaxed">
              ${r.description || 'A delicious homemade infusion.'}
            </p>

            <div class="flex items-center justify-between text-xs text-cozy-muted border-t border-cozy-border/40 pt-3">
              <span>🎨 ${colors}</span>
              <span class="font-semibold text-cozy-olivegreen group-hover:translate-x-1 transition">
                View Recipe →
              </span>
            </div>
          </a>
        `;
      }).join('');
    }
  </script>
</body>
</html>
