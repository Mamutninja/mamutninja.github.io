<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Drink Recipes — StillSip</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/icon.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="constants.js"></script>
  <script src="common.js"></script>

<body class="min-h-screen flex flex-col relative">

  <!-- DYNAMIC NAVIGATION HEADER -->
  <header id="site-header"></header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
    
    <!-- PAGE HERO HEADER -->
    <div class="text-left mb-8 border-b border-cozy-border pb-6 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-serif-heading text-3xl md:text-4xl font-bold text-cozy-text mb-2">All Drink Recipes</h1>
        <p class="text-cozy-muted text-base">Filter and discover non-alcoholic, still beverages tailored to your tastes.</p>
      </div>
      <button onclick="resetAllFilters()" class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-4 py-2 rounded-full hover:bg-cozy-olivegreen hover:text-white transition">
        ↺ Reset All Filters
      </button>
      <div class="flex items-center gap-2">
        <button onclick="exportRecipesJS()" class="text-xs font-semibold text-cozy-text bg-white border border-cozy-border px-4 py-2 rounded-full hover:border-cozy-olivegreen transition flex items-center gap-1.5 shadow-sm">
          <span>💾</span> Download Updated recipes.js
        </button>

        <button onclick="resetAllFilters()" class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-4 py-2 rounded-full hover:bg-cozy-olivegreen hover:text-white transition">
          ↺ Reset All Filters
        </button>
      </div>
    </div>

    <!-- MAIN TWO-COLUMN LAYOUT -->
    <div class="flex flex-col lg:flex-row gap-8 items-start">
      
      <!-- LEFT SIDEBAR: DYNAMIC 9-CATEGORY FILTERS -->
      <aside class="w-full lg:w-80 shrink-0 lg:sticky lg:top-20 max-h-[85vh] overflow-y-auto pr-1">
        <div class="cozy-card rounded-cozy p-5 space-y-6">
          
          <!-- SEARCH KEYWORD -->
          <div>
            <label for="search-input" class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-2">Search Keyword</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-cozy-muted text-sm">🔍</span>
              <input 
                type="text" 
                id="search-input" 
                placeholder="Mint, turmeric, lime..." 
                class="w-full pl-9 pr-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-cozy-text text-sm focus:outline-none focus:border-cozy-olivegreen transition" 
                oninput="filterRecipes()"
              />
            </div>
          </div>

          <hr class="border-cozy-border" />

          <!-- DYNAMIC FILTER CONTAINER -->
          <div id="dynamic-filters-container" class="space-y-6">
            <!-- Dynamically populated from TAXONOMY in constants.js -->
          </div>

          <!-- COUNT INDICATOR -->
          <div class="pt-3 border-t border-cozy-border flex items-center justify-between">
            <span id="recipe-count" class="text-xs font-semibold text-cozy-muted">Showing 0 recipes</span>
          </div>

        </div>
      </aside>

      <!-- RIGHT COLUMN: RECIPE GRID -->
      <div class="flex-1 w-full">
        
        <!-- ACTIVE BADGES CONTAINER -->
        <div id="active-badges-container" class="hidden mb-4 flex flex-wrap items-center gap-2">
          <span class="text-xs text-cozy-muted font-medium">Active Filters:</span>
          <div id="active-badges" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- RECIPE CARDS GRID -->
        <div id="recipe-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6"></div>

        <!-- EMPTY STATE -->
        <div id="empty-state" class="hidden text-center py-16 cozy-card rounded-cozy">
          <span class="text-4xl block mb-3">🫖</span>
          <h3 class="font-serif-heading font-bold text-xl text-cozy-text mb-1">No matching recipes</h3>
          <p class="text-cozy-muted text-sm max-w-sm mx-auto mb-4">Try clearing some filters to broaden your search.</p>
          <button onclick="resetAllFilters()" class="px-4 py-2 bg-cozy-olivegreen text-white rounded-full text-xs font-semibold hover:bg-cozy-olivegreen-hover transition">Reset All Filters</button>
        </div>

      </div>

    </div>
  </main>

  <!-- ALIGNED FLOATING ADD RECIPE BUTTON -->
  <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-full max-w-7xl px-4 flex justify-end pointer-events-none z-40">
    <a 
      href="add-recipe.html" 
      title="Add New Recipe" 
      class="pointer-events-auto w-14 h-14 rounded-full bg-cozy-olivegreen text-white flex items-center justify-center shadow-lg hover:bg-cozy-olivegreen-hover hover:scale-110 active:scale-95 transition-all duration-200 group relative"
    >
      <svg class="w-8 h-8 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      
      <!-- Hover Tooltip -->
      <span class="absolute right-16 bg-cozy-text text-white text-xs font-semibold px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap shadow-md pointer-events-none">
        Add New Recipe
      </span>
    </a>
  </div>

  <!-- DYNAMIC FOOTER -->
  <footer id="site-footer"></footer>

  <!-- RECIPE DATABASE & LOGIC -->
  <script src="recipes.js"></script>
  <script>
    let currentRecipe = null;
    let currentServings = 1;

    document.addEventListener('DOMContentLoaded', () => {
      loadRecipeDetail();
    });

    // Convert text to a clean slug (e.g. "Blue Cloud!" -> "blue-cloud")
    function slugify(text) {
      if (!text) return '';
      return text
        .toString()
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, '')
        .replace(/[\s_-]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    // Retrieve recipes from recipes.js + all possible localStorage keys
    function getAllStoredRecipes() {
      let recipes = [];

      // 1. If recipes.js has getCombinedRecipes helper
      if (typeof getCombinedRecipes === 'function') {
        try { recipes = getCombinedRecipes(); } catch(e) {}
      }

      // 2. Base array from recipes.js
      if (!recipes || recipes.length === 0) {
        recipes = (typeof ALL_RECIPES !== 'undefined') ? [...ALL_RECIPES] : [];
      }

      // 3. Scan all potential local storage keys
      const keysToCheck = [
        'cozy_custom_recipes',
        'custom_recipes',
        'customRecipes',
        'cozy_recipes',
        'recipes'
      ];

      keysToCheck.forEach(key => {
        try {
          const item = localStorage.getItem(key);
          if (item) {
            const parsed = JSON.parse(item);
            if (Array.isArray(parsed)) {
              recipes.push(...parsed);
            }
          }
        } catch (e) {}
      });

      // Deduplicate by ID / Name
      const uniqueMap = new Map();
      recipes.forEach(r => {
        if (!r) return;
        const key = (r.id || r.name || '').trim().toLowerCase();
        if (key && !uniqueMap.has(key)) {
          uniqueMap.set(key, r);
        }
      });

      return Array.from(uniqueMap.values());
    }

    function loadRecipeDetail() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawId = urlParams.get('id');

      if (!rawId) {
        showNotFoundError("No recipe ID specified in the URL.");
        return;
      }

      const decodedId = decodeURIComponent(rawId).trim();
      const targetSlug = slugify(decodedId);
      const allRecipes = getAllStoredRecipes();

      // Flexible matching: check ID, Name, or slugified match
      currentRecipe = allRecipes.find(r => {
        if (!r) return false;
        const rId = (r.id || '').trim();
        const rName = (r.name || '').trim();

        return (
          rId.toLowerCase() === decodedId.toLowerCase() ||
          rName.toLowerCase() === decodedId.toLowerCase() ||
          slugify(rId) === targetSlug ||
          slugify(rName) === targetSlug
        );
      });

      if (!currentRecipe) {
        showNotFoundError(`Recipe "${decodedId}" could not be found.`);
        return;
      }

      renderRecipePage(currentRecipe);
    }

    function renderRecipePage(r) {
      document.title = `${r.name} — StillSip`;
      
      document.getElementById('recipe-title').innerText = r.name || 'Untitled Recipe';
      document.getElementById('recipe-style').innerText = r.style || 'Drink';
      document.getElementById('recipe-description').innerText = r.description || '';
      document.getElementById('recipe-prep-time').innerText = r.prepMinutes || r.prepTime || '5 mins';
      
      const colors = Array.isArray(r.color) ? r.color.join(', ') : (r.color || 'Custom');
      document.getElementById('recipe-color').innerText = colors;
      
      document.getElementById('recipe-taste').innerText = r.primaryTaste || 'Fresh';
      document.getElementById('recipe-tip').innerText = r.tip || 'Enjoy your creation!';

      renderIngredients();

      const stepsContainer = document.getElementById('recipe-instructions');
      if (stepsContainer && Array.isArray(r.instructions)) {
        stepsContainer.innerHTML = r.instructions.map((step, idx) => `
          <li class="flex items-start gap-3 p-3.5 rounded-xl bg-cozy-bg/50 border border-cozy-border">
            <span class="font-bold text-xs text-white bg-cozy-olivegreen rounded-full w-6 h-6 flex items-center justify-center shrink-0 mt-0.5">
              ${idx + 1}
            </span>
            <p class="text-sm text-cozy-text font-medium leading-relaxed">${step}</p>
          </li>
        `).join('');
      }
    }

    function renderIngredients() {
      if (!currentRecipe || !currentRecipe.ingredients) return;
      
      const ingContainer = document.getElementById('recipe-ingredients');
      if (!ingContainer) return;

      const pantry = (typeof State !== 'undefined' && State.getPantry) ? State.getPantry() : [];

      ingContainer.innerHTML = currentRecipe.ingredients.map(ing => {
        const amt = (typeof ing.amount === 'number') ? ing.amount : parseFloat(ing.amount) || 1;
        const scaledAmount = (amt * currentServings).toFixed(1).replace(/\.0$/, '');
        const inPantry = pantry.some(p => p.trim().toLowerCase() === ing.name.trim().toLowerCase());

        return `
          <li class="flex items-center justify-between p-3 rounded-xl border border-cozy-border bg-white">
            <div class="flex items-center gap-2">
              <span class="text-xs ${inPantry ? 'text-emerald-600 font-bold' : 'text-amber-600 font-medium'}">
                ${inPantry ? '✓ In Pantry' : '○ Missing'}
              </span>
              <span class="text-sm font-semibold text-cozy-text">${ing.name}</span>
            </div>
            <span class="text-xs font-bold text-cozy-olivegreen bg-cozy-olivegreen/10 px-2.5 py-1 rounded-md">
              ${scaledAmount} ${ing.unit || ''}
            </span>
          </li>
        `;
      }).join('');
    }

    function updateServings(delta) {
      currentServings = Math.max(1, currentServings + delta);
      const el = document.getElementById('servings-count');
      if (el) el.innerText = currentServings;
      renderIngredients();
    }

    function showNotFoundError(message) {
      const mainContent = document.querySelector('main');
      if (!mainContent) return;

      mainContent.innerHTML = `
        <div class="text-center py-20 max-w-md mx-auto">
          <span class="text-5xl block mb-4">🔍</span>
          <h1 class="font-serif-heading font-bold text-2xl text-cozy-text mb-2">Recipe Not Found</h1>
          <p class="text-cozy-muted text-sm mb-6">${message}</p>
          <a href="recipes.html" class="inline-block px-6 py-3 rounded-full bg-cozy-olivegreen text-white font-semibold text-xs hover:bg-cozy-olivegreen-hover transition shadow-md">
            ← Return to All Recipes
          </a>
        </div>
      `;
    }
  </script>
