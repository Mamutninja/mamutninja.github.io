<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Drink Recipes — StillSip</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/icon.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Shared Theme & Styles -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="constants.js"></script>
  <script src="common.js"></script>
</head>
<body class="min-h-screen flex flex-col relative">

  <!-- DYNAMIC NAVIGATION HEADER -->
  <header id="site-header"></header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
    
    <!-- PAGE HERO HEADER -->
    <div class="text-left mb-8 border-b border-cozy-border pb-6 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-serif-heading text-3xl md:text-4xl font-bold text-cozy-text mb-2">All Drink Recipes</h1>
        <p class="text-cozy-muted text-base">Filter and discover non-alcoholic, still beverages tailored to your tastes.</p>
      </div>
      <button onclick="resetAllFilters()" class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-4 py-2 rounded-full hover:bg-cozy-olivegreen hover:text-white transition">
        ↺ Reset All Filters
      </button>
      <div class="flex items-center gap-2">
        <button onclick="exportRecipesJS()" class="text-xs font-semibold text-cozy-text bg-white border border-cozy-border px-4 py-2 rounded-full hover:border-cozy-olivegreen transition flex items-center gap-1.5 shadow-sm">
          <span>💾</span> Download Updated recipes.js
        </button>

        <button onclick="resetAllFilters()" class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-4 py-2 rounded-full hover:bg-cozy-olivegreen hover:text-white transition">
          ↺ Reset All Filters
        </button>
      </div>
    </div>

    <!-- MAIN TWO-COLUMN LAYOUT -->
    <div class="flex flex-col lg:flex-row gap-8 items-start">
      
      <!-- LEFT SIDEBAR: DYNAMIC 9-CATEGORY FILTERS -->
      <aside class="w-full lg:w-80 shrink-0 lg:sticky lg:top-20 max-h-[85vh] overflow-y-auto pr-1">
        <div class="cozy-card rounded-cozy p-5 space-y-6">
          
          <!-- SEARCH KEYWORD -->
          <div>
            <label for="search-input" class="block text-xs font-bold uppercase tracking-wider text-cozy-muted mb-2">Search Keyword</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-cozy-muted text-sm">🔍</span>
              <input 
                type="text" 
                id="search-input" 
                placeholder="Mint, turmeric, lime..." 
                class="w-full pl-9 pr-3 py-2 bg-cozy-bg rounded-xl border border-cozy-border text-cozy-text text-sm focus:outline-none focus:border-cozy-olivegreen transition" 
                oninput="filterRecipes()"
              />
            </div>
          </div>

          <hr class="border-cozy-border" />

          <!-- DYNAMIC FILTER CONTAINER -->
          <div id="dynamic-filters-container" class="space-y-6">
            <!-- Dynamically populated from TAXONOMY in constants.js -->
          </div>

          <!-- COUNT INDICATOR -->
          <div class="pt-3 border-t border-cozy-border flex items-center justify-between">
            <span id="recipe-count" class="text-xs font-semibold text-cozy-muted">Showing 0 recipes</span>
          </div>

        </div>
      </aside>

      <!-- RIGHT COLUMN: RECIPE GRID -->
      <div class="flex-1 w-full">
        
        <!-- ACTIVE BADGES CONTAINER -->
        <div id="active-badges-container" class="hidden mb-4 flex flex-wrap items-center gap-2">
          <span class="text-xs text-cozy-muted font-medium">Active Filters:</span>
          <div id="active-badges" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- RECIPE CARDS GRID -->
        <div id="recipe-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6"></div>

        <!-- EMPTY STATE -->
        <div id="empty-state" class="hidden text-center py-16 cozy-card rounded-cozy">
          <span class="text-4xl block mb-3">🫖</span>
          <h3 class="font-serif-heading font-bold text-xl text-cozy-text mb-1">No matching recipes</h3>
          <p class="text-cozy-muted text-sm max-w-sm mx-auto mb-4">Try clearing some filters to broaden your search.</p>
          <button onclick="resetAllFilters()" class="px-4 py-2 bg-cozy-olivegreen text-white rounded-full text-xs font-semibold hover:bg-cozy-olivegreen-hover transition">Reset All Filters</button>
        </div>

      </div>

    </div>
  </main>

  <!-- ALIGNED FLOATING ADD RECIPE BUTTON -->
  <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-full max-w-7xl px-4 flex justify-end pointer-events-none z-40">
    <a 
      href="add-recipe.html" 
      title="Add New Recipe" 
      class="pointer-events-auto w-14 h-14 rounded-full bg-cozy-olivegreen text-white flex items-center justify-center shadow-lg hover:bg-cozy-olivegreen-hover hover:scale-110 active:scale-95 transition-all duration-200 group relative"
    >
      <svg class="w-8 h-8 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      
      <!-- Hover Tooltip -->
      <span class="absolute right-16 bg-cozy-text text-white text-xs font-semibold px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap shadow-md pointer-events-none">
        Add New Recipe
      </span>
    </a>
  </div>

  <!-- DYNAMIC FOOTER -->
  <footer id="site-footer"></footer>

  <!-- RECIPE DATABASE & LOGIC -->
  <script src="recipes.js"></script>
  <script>
    // State management for filters
    const filterState = {
      query: '',
      styles: [],
      temperatures: [],
      colors: [],
      healthiness: [],
      primaryTastes: [],
      seasons: []
    };

    document.addEventListener('DOMContentLoaded', () => {
      buildDynamicFilters();
      initCatalog();
    });

    // 1. Fetch all recipes (built-in + local browser storage)
    function getCombinedRecipes() {
      const builtin = (typeof ALL_RECIPES !== 'undefined') ? ALL_RECIPES : [];
      let custom = [];

      const keysToCheck = ['cozy_custom_recipes', 'custom_recipes', 'customRecipes', 'recipes'];
      keysToCheck.forEach(key => {
        try {
          const item = localStorage.getItem(key);
          if (item) {
            const parsed = JSON.parse(item);
            if (Array.isArray(parsed)) custom.push(...parsed);
          }
        } catch (e) {}
      });

      const uniqueMap = new Map();
      [...builtin, ...custom].forEach(r => {
        if (!r) return;
        const key = (r.id || r.name || '').trim().toLowerCase();
        if (key && !uniqueMap.has(key)) {
          uniqueMap.set(key, r);
        }
      });

      return Array.from(uniqueMap.values());
    }

    // 2. Dynamically build Pill Accordion UI from TAXONOMY in constants.js
    function buildDynamicFilters() {
      const container = document.getElementById('dynamic-filters-container');
      if (!container || typeof TAXONOMY === 'undefined') return;

      let html = '';

      // Helper: Renders accordion group with responsive pill tags (NO nested scrollboxes!)
      const renderGroup = (title, categoryKey, items, defaultOpen = true) => {
        if (!items || items.length === 0) return '';
        
        const pills = items.map(item => {
          const label = typeof item === 'object' ? item.label : item;
          const val = typeof item === 'object' ? item.value : item;
          
          return `
            <label class="cursor-pointer select-none">
              <input 
                type="checkbox" 
                data-category="${categoryKey}" 
                value="${val}" 
                onchange="handleFilterChange(this)"
                class="sr-only peer"
              />
              <span class="inline-block text-xs font-semibold px-3 py-1.5 rounded-full border border-cozy-border bg-cozy-bg text-cozy-text peer-checked:bg-cozy-olivegreen peer-checked:text-white peer-checked:border-cozy-olivegreen hover:border-cozy-olivegreen/60 transition-all duration-150 shadow-sm">
                ${label}
              </span>
            </label>
          `;
        }).join('');

        return `
          <details class="group border-b border-cozy-border/60 pb-3" ${defaultOpen ? 'open' : ''}>
            <summary class="flex items-center justify-between cursor-pointer list-none text-xs font-bold uppercase tracking-wider text-cozy-muted py-1 hover:text-cozy-olivegreen transition">
              <span>${title}</span>
              <span class="text-cozy-muted group-open:rotate-180 transition-transform duration-200 text-xs">▼</span>
            </summary>
            <div class="flex flex-wrap gap-1.5 pt-2.5">
              ${pills}
            </div>
          </details>
        `;
      };

      if (TAXONOMY.STYLES || TAXONOMY.DRINK_STYLES) {
        html += renderGroup('Drink Style', 'styles', TAXONOMY.STYLES || TAXONOMY.DRINK_STYLES, true);
      }
      if (TAXONOMY.HEALTHINESS) {
        html += renderGroup('Dietary & Wellness', 'healthiness', TAXONOMY.HEALTHINESS, true);
      }
      if (TAXONOMY.TEMPERATURES) {
        html += renderGroup('Temperature', 'temperatures', TAXONOMY.TEMPERATURES, true);
      }
      if (TAXONOMY.COLORS) {
        html += renderGroup('Color', 'colors', TAXONOMY.COLORS, false);
      }
      if (TAXONOMY.PRIMARY_TASTES) {
        html += renderGroup('Taste Profile', 'primaryTastes', TAXONOMY.PRIMARY_TASTES, false);
      }
      if (TAXONOMY.SEASONS) {
        html += renderGroup('Season', 'seasons', TAXONOMY.SEASONS, false);
      }

      container.innerHTML = html;
    }

    // 3. Initialize search bar and catalog load
    function initCatalog() {
      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.value = '';
        searchInput.addEventListener('input', (e) => {
          filterState.query = e.target.value.toLowerCase().trim();
          applyFilters();
        });
      }

      applyFilters();
    }

    // 4. Update filterState when pills are toggled
    function handleFilterChange(checkbox) {
      const category = checkbox.dataset.category;
      const val = checkbox.value;

      if (checkbox.checked) {
        if (!filterState[category].includes(val)) {
          filterState[category].push(val);
        }
      } else {
        filterState[category] = filterState[category].filter(v => v !== val);
      }

      applyFilters();
    }

    // 5. Multi-criteria filtering logic
    function applyFilters() {
      const allRecipes = getCombinedRecipes();

      const filtered = allRecipes.filter(r => {
        // Keyword Search
        if (filterState.query) {
          const nameMatch = r.name && r.name.toLowerCase().includes(filterState.query);
          const styleMatch = r.style && r.style.toLowerCase().includes(filterState.query);
          const ingMatch = r.ingredients && r.ingredients.some(i => i.name.toLowerCase().includes(filterState.query));
          if (!nameMatch && !styleMatch && !ingMatch) return false;
        }

        // Style Filter
        if (filterState.styles.length > 0 && (!r.style || !filterState.styles.includes(r.style))) {
          return false;
        }

        // Temperature Filter
        if (filterState.temperatures.length > 0 && (!r.temperature || !filterState.temperatures.includes(r.temperature))) {
          return false;
        }

        // Color Filter
        if (filterState.colors.length > 0) {
          const rColors = Array.isArray(r.color) ? r.color : [r.color];
          const hasColor = rColors.some(c => filterState.colors.includes(c));
          if (!hasColor) return false;
        }

        // Healthiness Filter
        if (filterState.healthiness.length > 0) {
          const rHealth = Array.isArray(r.healthiness) ? r.healthiness : [r.healthiness];
          const hasHealth = filterState.healthiness.every(h => rHealth.includes(h));
          if (!hasHealth) return false;
        }

        // Primary Taste Filter
        if (filterState.primaryTastes.length > 0 && (!r.primaryTaste || !filterState.primaryTastes.includes(r.primaryTaste))) {
          return false;
        }

        // Season Filter
        if (filterState.seasons.length > 0 && (!r.season || !filterState.seasons.includes(r.season))) {
          return false;
        }

        return true;
      });

      updateActiveBadges();
      renderRecipeCards(filtered);
    }

    // 6. Update Active Badges and Count Indicator
    function updateActiveBadges() {
      const container = document.getElementById('active-badges-container');
      const badgesBox = document.getElementById('active-badges');
      const countEl = document.getElementById('recipe-count');

      let activeTags = [];
      Object.keys(filterState).forEach(key => {
        if (key !== 'query' && Array.isArray(filterState[key])) {
          activeTags.push(...filterState[key]);
        }
      });

      if (container && badgesBox) {
        if (activeTags.length > 0 || filterState.query) {
          container.classList.remove('hidden');
          
          let html = '';
          if (filterState.query) {
            html += `<span class="bg-cozy-olivegreen/15 text-cozy-text text-xs px-2.5 py-1 rounded-full font-medium border border-cozy-olivegreen/20">🔍 "${filterState.query}"</span>`;
          }
          activeTags.forEach(tag => {
            html += `<span class="bg-cozy-olivegreen text-white text-xs px-2.5 py-1 rounded-full font-medium shadow-sm">${tag}</span>`;
          });
          badgesBox.innerHTML = html;
        } else {
          container.classList.add('hidden');
        }
      }
    }

    // 7. Render Recipe Cards Grid
    function renderRecipeCards(recipes) {
      const container = document.getElementById('recipe-grid');
      const emptyState = document.getElementById('empty-state');
      const countEl = document.getElementById('recipe-count');

      if (countEl) {
        countEl.innerText = `Showing ${recipes.length} recipe${recipes.length === 1 ? '' : 's'}`;
      }

      if (!container) return;

      if (recipes.length === 0) {
        container.innerHTML = '';
        if (emptyState) emptyState.classList.remove('hidden');
        return;
      }

      if (emptyState) emptyState.classList.add('hidden');

      container.innerHTML = recipes.map(r => {
        const recipeId = r.id || r.name;
        const colors = Array.isArray(r.color) ? r.color.join(', ') : (r.color || 'Drink');
        const time = r.prepMinutes || r.prepTime || '5 mins';

        return `
          <a href="recipe.html?id=${encodeURIComponent(recipeId)}" 
             class="cozy-card block rounded-2xl p-5 hover:-translate-y-1 transition duration-200 group">
            <div class="flex justify-between items-start mb-3">
              <span class="text-xs font-semibold text-cozy-olivegreen bg-cozy-olivegreen/10 px-2.5 py-1 rounded-md">
                ${r.style || 'Drink'}
              </span>
              <span class="text-xs text-cozy-muted">⏱️ ${time}</span>
            </div>
            
            <h3 class="font-serif-heading font-bold text-lg text-cozy-text mb-2 group-hover:text-cozy-olivegreen transition">
              ${r.name}
            </h3>
            
            <p class="text-xs text-cozy-muted line-clamp-2 mb-4 leading-relaxed">
              ${r.description || 'A delicious homemade infusion.'}
            </p>

            <div class="flex items-center justify-between text-xs text-cozy-muted border-t border-cozy-border/40 pt-3">
              <span>🎨 ${colors}</span>
              <span class="font-semibold text-cozy-olivegreen group-hover:translate-x-1 transition">
                View Recipe →
              </span>
            </div>
          </a>
        `;
      }).join('');
    }

    // 8. Reset All Filters Action
    function resetAllFilters() {
      filterState.query = '';
      Object.keys(filterState).forEach(k => {
        if (Array.isArray(filterState[k])) filterState[k] = [];
      });

      const searchInput = document.getElementById('search-input');
      if (searchInput) searchInput.value = '';

      const checkboxes = document.querySelectorAll('#dynamic-filters-container input[type="checkbox"]');
      checkboxes.forEach(cb => cb.checked = false);

      applyFilters();
    }

    // 9. Export JS File Action
    function exportRecipesJS() {
      const recipes = getCombinedRecipes();
      const jsContent = `const ALL_RECIPES = ${JSON.stringify(recipes, null, 2)};\n\nif (typeof module !== 'undefined') {\n  module.exports = { ALL_RECIPES };\n}`;
      
      const blob = new Blob([jsContent], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'recipes.js';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
